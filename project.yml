name: PhoneList
options:
  bundleIdPrefix: com.lgbouma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  PhoneList:
    path: .
targets:
  PhoneList:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PhoneList
        product: PhoneListUI
      - package: PhoneList
        product: PhoneListCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: rdo
        UILaunchScreen: {}
        DropboxAppKey: $(DROPBOX_APP_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.lgbouma.phonelist.oauth
            CFBundleURLSchemes:
              - db-$(DROPBOX_APP_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgbouma.phonelist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
  PhoneListUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PhoneList
    settings:
      base:
        SWIFT_VERSION: "5.0"
